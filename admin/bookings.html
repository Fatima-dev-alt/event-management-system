<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Bookings - Eventify</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* ---------- ADMIN LAYOUT ---------- */
    .admin-layout {
      display: flex;
      min-height: calc(100vh - var(--topbar-height));
    }

    .admin-sidebar {
      width: var(--sidebar-width);
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      flex-shrink: 0;
    }

    .admin-sidebar-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 8px 12px;
      margin-bottom: 8px;
    }

    .admin-sidebar a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      transition: var(--transition);
    }

    .admin-sidebar a:hover,
    .admin-sidebar a.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    .admin-sidebar svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .admin-main {
      flex: 1;
      min-width: 0;
      padding: 30px 24px;
    }

    .admin-topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      height: var(--topbar-height);
    }

    .admin-topbar-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .admin-topbar-title {
      font-size: 18px;
      font-weight: 800;
    }

    .admin-topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-hamburger {
      display: none;
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      align-items: center;
      justify-content: center;
    }

    .admin-hamburger svg {
      width: 22px;
      height: 22px;
    }

    .admin-overlay {
      display: none;
    }

    /* ---------- BOOKING STATUS ---------- */
    .booking-status {
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .booking-status.confirmed {
      background: var(--success-light);
      color: var(--success);
    }

    .booking-status.pending {
      background: var(--warning-light);
      color: var(--warning);
    }

    .booking-status.cancelled {
      background: var(--danger-light);
      color: var(--danger);
    }

    .booking-status.completed {
      background: var(--surface-2);
      color: var(--text-muted);
    }

    .booking-id {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
    }

    .customer-cell strong {
      display: block;
      font-size: 14px;
    }

    .customer-cell span {
      display: block;
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .seat-list {
      font-size: 12px;
      color: var(--text-muted);
      max-width: 150px;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 900px) {
      .admin-sidebar {
        position: fixed;
        left: 0;
        top: var(--topbar-height);
        bottom: 0;
        z-index: 900;
        transform: translateX(-100%);
        transition: transform .25s ease;
        box-shadow: var(--shadow-lg);
      }

      .admin-sidebar.open {
        transform: translateX(0);
      }

      .admin-hamburger {
        display: flex;
      }

      .admin-overlay {
        position: fixed;
        inset: var(--topbar-height) 0 0 0;
        background: rgba(15,23,42,.45);
        z-index: 800;
      }

      .admin-overlay.open {
        display: block;
      }

      .admin-main {
        padding: 24px 16px;
      }
    }

    @media (max-width: 640px) {
      .admin-main {
        padding: 20px 12px;
      }

      .admin-topbar-title {
        font-size: 16px;
      }

      .panel {
        padding: 15px;
      }

      .filters-bar {
        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- ---------- TOPBAR ---------- -->
  <header class="admin-topbar">
    <div class="container admin-topbar-inner">

      <div style="display:flex; align-items:center; gap:10px;">
        <button class="admin-hamburger" id="adminHamburger" type="button" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="4" y1="6" x2="20" y2="6"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="18" x2="20" y2="18"/>
          </svg>
        </button>

        <div class="admin-topbar-title">Eventify Admin</div>
      </div>

      <div class="admin-topbar-right">
        <button class="theme-toggle" type="button" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
          </svg>

          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>

    </div>
  </header>


  <div class="admin-layout">

    <!-- ---------- SIDEBAR ---------- -->
    <aside class="admin-sidebar" id="adminSidebar">

      <div class="admin-sidebar-title">Management</div>

      <a href="admin-events.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="17" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Events
      </a>

      <a href="admin-bookings.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M7 9h10M7 13h7M7 17h4"/>
        </svg>
        Bookings
      </a>

      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Customers
      </a>

    </aside>

    <div class="admin-overlay" id="adminOverlay"></div>


    <!-- ---------- MAIN CONTENT ---------- -->
    <main class="admin-main">

      <div class="section-head">
        <div>
          <h1 class="section-title">Bookings</h1>
          <p class="section-subtitle">
            Manage customer bookings and booking status.
          </p>
        </div>
      </div>


      <!-- ---------- FILTERS ---------- -->
      <div class="filters-bar">

        <div class="nav-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Search booking, customer or email..."
          >
        </div>

        <select id="eventFilter">
          <option value="all">All Events</option>
        </select>

        <select id="statusFilter">
          <option value="all">All Statuses</option>
          <option value="Confirmed">Confirmed</option>
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
          <option value="Cancelled">Cancelled</option>
        </select>

        <div class="filters-count" id="bookingCount">
          0 bookings
        </div>

      </div>


      <!-- ---------- BOOKINGS TABLE ---------- -->
      <div class="panel">

        <div class="panel-header">
          <h3>All Bookings</h3>
        </div>

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th data-sort="id">
                  Booking ID
                  <span class="sort-arrow">&#9662;</span>
                </th>

                <th data-sort="fullName">
                  Customer
                  <span class="sort-arrow">&#9662;</span>
                </th>

                <th data-sort="eventId">
                  Event
                  <span class="sort-arrow">&#9662;</span>
                </th>

                <th data-sort="bookingDate">
                  Booking Date
                  <span class="sort-arrow">&#9662;</span>
                </th>

                <th data-sort="totalAmount">
                  Amount
                  <span class="sort-arrow">&#9662;</span>
                </th>

                <th>Status</th>

                <th>Action</th>
              </tr>
            </thead>

            <tbody id="bookingsTableBody"></tbody>

          </table>

        </div>

      </div>


      <div class="pagination" id="pagination"></div>

    </main>

  </div>


  <!-- ---------- JAVASCRIPT ---------- -->
  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="theme.js"></script>
  <script src="admin-bookings.js"></script>

</body>
</html>
